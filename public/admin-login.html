<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/logo.png">
    <title>Admin Login | Explore India</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-body">
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo"><img src="images/logo.png" alt="Explore India Logo"></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="destinations.html">Destinations</a></li>
                <li><a href="packages.html">Packages</a></li>
                <li><a href="booking.html">Book Enquiry</a></li>
                <li><a href="admin-login.html" class="active">Admin</a></li>
            </ul>
        </nav>
    </header>
    <main class="login-wrap">
        <form class="login-card" id="login-form">
            <div class="login-icon">🔐</div>
            <h2>Admin Login</h2>
            <p>Sign in to view enquiries and manage packages.</p>
            <div class="alert" id="login-error" hidden></div>
            <label for="username">Username</label>
            <input type="text" id="username" required autocomplete="username">
            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="current-password">
            <button type="submit" class="btn btn-primary btn-block">Login</button>
            <a href="index.html" class="back-link">← Back to website</a>
        </form>
    </main>
    <script src="js/admin.js"></script>
</body>
</html>
